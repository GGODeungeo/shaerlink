name: Refresh trending keywords

on:
  # Schedule trigger disabled: now calls the ShareLink API directly (same
  # pipeline as refresh-data.yml) instead of the cookie-authenticated Toss
  # Business dashboard, so it's bound by the same IP allowlist - GitHub-hosted
  # runners can't call it. Re-enable once this runs from a fixed-IP host.
  # schedule:
  #   - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trending keywords ingestion
        env:
          SHARELINK_ACCESS_KEY: ${{ secrets.SHARELINK_ACCESS_KEY }}
          SHARELINK_SECRET_KEY: ${{ secrets.SHARELINK_SECRET_KEY }}
          SHARELINK_PUBLISHER_ID: ${{ secrets.SHARELINK_PUBLISHER_ID }}
          PRODUCTS_DB_DATABASE_URL: ${{ secrets.PRODUCTS_DB_DATABASE_URL }}
        run: python3 fetch_trending_keywords.py
